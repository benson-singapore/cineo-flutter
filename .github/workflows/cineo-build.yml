name: Cineo Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ github.ref_name }}

jobs:
  android:
    name: Build signed Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.9'
          cache: true

      - name: Select Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          java -version

      - name: Set up Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p android/app/release
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release/cineo-release.keystore
            cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=app/release/cineo-release.keystore
          EOF
          else
            echo 'ANDROID_* signing secrets are not configured; generating an ephemeral self-signed key for this artifact.'
            keytool -genkeypair -v \
              -storetype JKS \
              -keystore android/app/release/cineo-release.keystore \
              -alias cineo \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass cineo-ephemeral-password \
              -keypass cineo-ephemeral-password \
              -dname 'CN=Cineo, OU=Build, O=Cineo, L=Singapore, ST=Singapore, C=SG'
            cat > android/key.properties <<EOF
          storePassword=cineo-ephemeral-password
          keyPassword=cineo-ephemeral-password
          keyAlias=cineo
          storeFile=app/release/cineo-release.keystore
          EOF
          fi

      - name: Build APK
        run: |
          VERSION="${RELEASE_VERSION#v}"
          VERSION_NAME="${VERSION%%+*}"
          BUILD_NUMBER="$(sed -nE 's/^version: [0-9]+\.[0-9]+\.[0-9]+\+([1-9][0-9]*)$/\1/p' pubspec.yaml)"
          test -n "${BUILD_NUMBER}"
          flutter build apk --release --build-name "${VERSION_NAME}" --build-number "${BUILD_NUMBER}"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: cineo-android-${{ github.ref_name }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.9'
          cache: true

      - name: Build unsigned iOS app
        run: |
          set -o pipefail
          VERSION="${RELEASE_VERSION#v}"
          VERSION_NAME="${VERSION%%+*}"
          BUILD_NUMBER="$(sed -nE 's/^version: [0-9]+\.[0-9]+\.[0-9]+\+([1-9][0-9]*)$/\1/p' pubspec.yaml)"
          test -n "${BUILD_NUMBER}"
          flutter build ios --release --no-codesign --config-only \
            --build-name "${VERSION_NAME}" \
            --build-number "${BUILD_NUMBER}"
          mkdir -p build/ios
          if ! xcodebuild \
              -workspace ios/Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build/ios \
              IPHONEOS_DEPLOYMENT_TARGET=15.0 \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build 2>&1 | tee build/ios/xcodebuild.log; then
            echo 'xcodebuild failed; relevant diagnostics:' >&2
            grep -Ein 'error:|failed|failure|signing|deployment target' \
              build/ios/xcodebuild.log | tail -80 >&2 || true
            exit 1
          fi

      - name: Package unsigned IPA
        run: |
          rm -rf build/ios/unsigned-ipa
          mkdir -p build/ios/unsigned-ipa/Payload
          cp -R build/ios/Build/Products/Release-iphoneos/Runner.app \
            build/ios/unsigned-ipa/Payload/Runner.app
          cd build/ios/unsigned-ipa
          zip -qry Cineo-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v5
        with:
          name: cineo-ios-unsigned-${{ github.ref_name }}
          path: build/ios/unsigned-ipa/Cineo-unsigned.ipa
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [android, ios]
    if: needs.android.result == 'success' && needs.ios.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v5

      - name: Download Android APK
        uses: actions/download-artifact@v5
        with:
          name: cineo-android-${{ github.ref_name }}
          path: release-assets/android

      - name: Download unsigned iOS IPA
        uses: actions/download-artifact@v5
        with:
          name: cineo-ios-unsigned-${{ github.ref_name }}
          path: release-assets/ios

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets/publish
          cp release-assets/android/app-release.apk \
            "release-assets/publish/Cineo-${GITHUB_REF_NAME}-android.apk"
          cp release-assets/ios/Cineo-unsigned.ipa \
            "release-assets/publish/Cineo-${GITHUB_REF_NAME}-ios-unsigned.ipa"
          ls -lh release-assets/publish

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes_file="docs/update/${tag}.md"

          if gh release view "${tag}" >/dev/null 2>&1; then
            if [ -f "${notes_file}" ]; then
              gh release edit "${tag}" --notes-file "${notes_file}"
            fi
            gh release upload "${tag}" release-assets/publish/* --clobber
          elif [ -f "${notes_file}" ]; then
            gh release create "${tag}" \
              --title "Cineo ${tag}" \
              --notes-file "${notes_file}" \
              release-assets/publish/*
          else
            gh release create "${tag}" \
              --title "Cineo ${tag}" \
              --generate-notes \
              release-assets/publish/*
          fi
